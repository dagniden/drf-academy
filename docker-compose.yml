x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:-local-dev-secret-key}
  DEBUG: ${DEBUG:-1}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
  DB_ENGINE: postgres
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-academy}
  DB_USER: ${POSTGRES_USER:-academy}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-academy}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-webmaster@localhost}
  STRIPE_API_KEY: ${STRIPE_API_KEY:-}

services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academy}
      POSTGRES_USER: ${POSTGRES_USER:-academy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-academy} -d ${POSTGRES_DB:-academy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      <<: *app-build
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "manage.py", "migrate", "--noinput"]

  web:
    build:
      <<: *app-build
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-8001}:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    restart: unless-stopped

  celery_worker:
    build:
      <<: *app-build
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    restart: unless-stopped

  celery_beat:
    build:
      <<: *app-build
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    restart: unless-stopped

volumes:
  postgres_data:
