name: CI v1

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          python -m poetry install --with lint --no-interaction --no-root

      - name: Run migrations
        working-directory: ${{ github.workspace }}
        run: python -m poetry run python manage.py migrate

      - name: Run tests
        working-directory: ${{ github.workspace }}
        run: python -m poetry run python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    env:
      SSH_HOST: ${{ secrets.SERVER_IP }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      APP_SERVICE: ${{ secrets.APP_SERVICE }}
      SSH_OPTS: -o StrictHostKeyChecking=no

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Install deploy tools
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync openssh-client
          else
            apt-get update
            apt-get install -y rsync openssh-client
          fi

      - name: Copy project files to server
        run: |
          ssh $SSH_OPTS $SSH_USER@$SSH_HOST "mkdir -p $DEPLOY_DIR"
          rsync -avz --delete --exclude '.git' --exclude '.github' --exclude '.venv' --exclude '__pycache__' --exclude 'htmlcov' -e "ssh $SSH_OPTS" . $SSH_USER@$SSH_HOST:$DEPLOY_DIR

      - name: Deploy on server
        run: |
          ssh $SSH_OPTS $SSH_USER@$SSH_HOST "bash -se" << EOF
            cd "$DEPLOY_DIR"

            if ! python3 -m venv --help >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y python3-venv
            fi

            if [ ! -x venv/bin/python ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install poetry
            python -m poetry install --only main --no-interaction --no-root
            python -m poetry run python manage.py migrate
            python -m poetry run python manage.py collectstatic --noinput
            sudo systemctl restart "$APP_SERVICE"
          EOF
