name: Django CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'poetry'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Configure Poetry
        run: python -m poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: python -m poetry install --with lint --no-interaction --no-root

      - name: Run linters
        run: |
          python -m poetry run black --check .
          python -m poetry run isort --check .
          python -m poetry run flake8 .

      - name: Run migrate
        run: python -m poetry run python manage.py migrate

      - name: Run tests
        run: python -m poetry run python manage.py test
